name: Prepare upstream integration

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch or tag to review'
        required: false
        default: main
  schedule:
    - cron: '15 7 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Picturefish main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Create review-only integration branch
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_ref="${INPUT_UPSTREAM_REF:-main}"
          if [[ ! "$upstream_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid upstream ref: $upstream_ref" >&2
            exit 1
          fi

          git config user.name "picturefish-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/johansan/notebook-navigator.git
          git fetch --no-tags upstream "$upstream_ref"

          upstream_sha="$(git rev-parse "FETCH_HEAD")"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Picturefish main already contains $upstream_ref ($upstream_sha)."
            exit 0
          fi

          branch="integration/upstream-${upstream_sha:0:12}"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number,url --jq '.[0] // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "An open integration PR already exists for $upstream_sha: $existing_pr"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Integration branch $branch exists without an open PR; refusing to overwrite it." >&2
            exit 1
          fi

          git switch -c "$branch"
          if ! git merge --no-commit --no-ff "$upstream_sha"; then
            git merge --abort || true
            echo "Upstream integration has conflicts; no branch or PR was created." >&2
            exit 1
          fi

          git commit -m "Prepare upstream integration ${upstream_sha:0:12}"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Review upstream integration ${upstream_sha:0:12}" \
            --body "## Review-only upstream integration

          Source: https://github.com/johansan/notebook-navigator
          Upstream commit: `$upstream_sha`

          This PR is intentionally not auto-merged. Review license, security, plugin IDs, migrations, and all conflicts before merging."
